<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Lung Cancer AI Platform</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #38bdf8; }
    p { color: #94a3b8; margin-bottom: 1.5rem; }
    a {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.9; }
  </style>
  <script>
    // In SPA, if a path was refreshed, redirect back to root
    if (window.location.pathname !== '/' && window.location.pathname !== '/404.html') {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <h1>404 - Not Found</h1>
  <p>The requested page could not be found.</p>
  <a href="/">Return to Clinical AI Platform</a>
</body>
</html>
