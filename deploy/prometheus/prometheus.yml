global:
  scrape_interval:     10s
  evaluation_interval: 10s
  external_labels:
    monitor: 'lung-cancer-ai-platform'

scrape_configs:
  # Lung Cancer AI Backend
  - job_name: 'lung-cancer-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout:  8s
    honor_labels: true

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter (system metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []
