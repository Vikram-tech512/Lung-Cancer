name: Build, Test & Deploy Production Platform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize Database & Run Smoke Tests
        run: |
          python scripts/init_db.py
          pytest tests/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Frontend SPA
        working-directory: ./frontend
        run: |
          npm install
          npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloud VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /opt/lung-cancer-ai
            git pull origin main
            docker compose -f deployment/docker/docker-compose.prod.yml build
            docker compose -f deployment/docker/docker-compose.prod.yml up -d --remove-orphans
            
            # Health Check Verification
            sleep 15
            HEALTH=$(curl -s http://localhost/api/health | grep -o "ONLINE" | head -n 1)
            if [ "$HEALTH" != "ONLINE" ]; then
                echo "Deployment Health Check Failed! Rolling back..."
                exit 1
            fi
            echo "Production Deployment Verified 100% Online!"
