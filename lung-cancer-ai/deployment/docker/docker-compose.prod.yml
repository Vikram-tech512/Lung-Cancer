version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: lung_cancer_ai_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - lung_ai_network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: lung_cancer_ai_frontend
    restart: always
    networks:
      - lung_ai_network

  backend:
    build:
      context: ../../
      dockerfile: backend/Dockerfile
    container_name: lung_cancer_ai_backend
    restart: always
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+psycopg2://lungai:lungaipassword@postgres:5432/lung_cancer_ai
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ROOT=/app/storage_bucket
      - SECRET_KEY=super-secret-production-key-lung-cancer-ai-2026
    volumes:
      - storage_data:/app/storage_bucket
      - ../../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lung_ai_network

  worker:
    build:
      context: ../../
      dockerfile: worker/Dockerfile
    container_name: lung_cancer_ai_worker
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://lungai:lungaipassword@postgres:5432/lung_cancer_ai
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ROOT=/app/storage_bucket
    volumes:
      - storage_data:/app/storage_bucket
      - ../../data:/app/data
    depends_on:
      - backend
      - redis
    networks:
      - lung_ai_network

  postgres:
    image: postgres:16-alpine
    container_name: lung_cancer_ai_postgres
    restart: always
    environment:
      - POSTGRES_USER=lungai
      - POSTGRES_PASSWORD=lungaipassword
      - POSTGRES_DB=lung_cancer_ai
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lungai -d lung_cancer_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lung_ai_network

  redis:
    image: redis:7-alpine
    container_name: lung_cancer_ai_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - lung_ai_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: lung_cancer_ai_mlflow
    restart: always
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlflow
    networks:
      - lung_ai_network

networks:
  lung_ai_network:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  storage_data:
  mlflow_data:
  certbot_etc:
  certbot_var:
