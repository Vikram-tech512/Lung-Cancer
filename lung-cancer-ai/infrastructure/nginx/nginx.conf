events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend_api {
        server backend:8000;
    }

    upstream frontend_client {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 500M; # Support large volumetric DICOM ZIP archives

        # Clinical Disclaimer Header added to all responses (§55)
        add_header X-Clinical-Disclaimer "AI-assisted preliminary analysis. Radiologist review required. Not a standalone diagnostic device." always;

        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        location /api/ws/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend_client;
            proxy_set_header Host $host;
        }
    }
}
