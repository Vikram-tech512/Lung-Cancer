name: Deploy to Zoho Catalyst

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy-zoho:
    name: 🚀 Deploy to Zoho Catalyst (Web Client + AppSail)
    runs-on: ubuntu-latest
    env:
      CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://lung-cancer-ai-backend-50046818991.development.catalystappsail.in
        run: |
          npm ci
          npm run build
          cp client-package.json dist/client-package.json

      - name: Install Zoho Catalyst CLI
        run: npm i -g zcatalyst-cli

      - name: Deploy to Zoho Catalyst
        if: env.CATALYST_TOKEN != ''
        env:
          CATALYST_PROJECT_NAME: Project-Rainfall
          CATALYST_ORG: '60091696171'
        run: |
          ORG_FLAG=""
          if [ -n "$CATALYST_ORG" ]; then
            ORG_FLAG="--org $CATALYST_ORG"
          fi
          catalyst deploy --project "$CATALYST_PROJECT_NAME" $ORG_FLAG --token "$CATALYST_TOKEN"
