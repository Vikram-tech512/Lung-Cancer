name: Deploy Lung Cancer AI Platform

# ==============================================================================
# REQUIRED GITHUB REPOSITORY SECRETS:
#   Configure in GitHub: Repository > Settings > Secrets and variables > Actions
#   - AWS_ACCESS_KEY_ID: IAM Access Key for S3 & CloudFront deployment
#   - AWS_SECRET_ACCESS_KEY: IAM Secret Access Key
#   - S3_BUCKET_NAME: S3 Bucket Name hosting the frontend static assets
#   - CLOUDFRONT_DISTRIBUTION_ID: CloudFront distribution ID for cache invalidation
#   - EC2_PUBLIC_IP: Public IPv4 address of the EC2 instance hosting backend
#   - EC2_SSH_PRIVATE_KEY: SSH private key content (.pem) for ec2-user authentication
# ==============================================================================

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    secrets:
      S3_BUCKET_NAME:
        required: false
      CLOUDFRONT_DISTRIBUTION_ID:
        required: false
      EC2_PUBLIC_IP:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      EC2_SSH_PRIVATE_KEY:
        required: false

env:
  AWS_REGION: us-east-1

jobs:
  # ────────────────────────────────────────────────
  # JOB 1: Deploy Frontend → S3 + CloudFront
  # ────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      EC2_HOST: ${{ secrets.EC2_PUBLIC_IP }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Inject production API URL
        working-directory: frontend
        run: |
          echo "VITE_API_BASE_URL=http://${{ env.EC2_HOST }}:8000" > .env.production

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        run: |
          aws s3 sync frontend/dist s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: ✅ Frontend deployed
        run: echo "Frontend deployed to S3 and CloudFront invalidated."

  # ────────────────────────────────────────────────
  # JOB 2: Deploy Backend → EC2 t2.micro
  # ────────────────────────────────────────────────
  deploy-backend:
    name: 🐍 Deploy Backend (EC2 t2.micro)
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_PUBLIC_IP }}
      EC2_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.EC2_KEY }}" > ~/.ssh/lung_cancer_ec2.pem
          chmod 600 ~/.ssh/lung_cancer_ec2.pem
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2 via SSH
        run: |
          ssh -i ~/.ssh/lung_cancer_ec2.pem ec2-user@${{ env.EC2_HOST }} << 'REMOTE_COMMANDS'
            set -e
            echo "=== Pulling latest code ==="
            cd /app
            git pull origin main

            echo "=== Rebuilding & restarting backend container ==="
            docker compose up -d --build --no-deps backend

            echo "=== Waiting for health check ==="
            sleep 15
            curl -f http://localhost:8000/api/v2/health && echo "✅ Backend healthy!" || echo "⚠️ Health check failed"
          REMOTE_COMMANDS

      - name: ✅ Backend deployed
        run: echo "Backend successfully redeployed on EC2."
