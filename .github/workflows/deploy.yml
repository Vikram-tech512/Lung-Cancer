name: Deploy Lung Cancer AI Platform

# ==============================================================================
# REQUIRED GITHUB REPOSITORY SECRETS:
#   Configure in GitHub: Repository > Settings > Secrets and variables > Actions
#   - AWS_ACCESS_KEY_ID: IAM Access Key for S3 & CloudFront deployment
#   - AWS_SECRET_ACCESS_KEY: IAM Secret Access Key
#   - S3_BUCKET_NAME: S3 Bucket Name hosting the frontend static assets
#   - CLOUDFRONT_DISTRIBUTION_ID: CloudFront distribution ID for cache invalidation
#   - EC2_PUBLIC_IP: Public IPv4 address of the EC2 instance hosting backend
#   - EC2_SSH_PRIVATE_KEY: SSH private key content (.pem) for ec2-user authentication
# ==============================================================================

on:
  workflow_run:
    workflows: ["CI - Test & Quality Assurance"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    secrets:
      S3_BUCKET_NAME:
        required: false
      CLOUDFRONT_DISTRIBUTION_ID:
        required: false
      EC2_PUBLIC_IP:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      EC2_SSH_PRIVATE_KEY:
        required: false

env:
  AWS_REGION: us-east-1

jobs:
  # ────────────────────────────────────────────────
  # JOB 1: Deploy Frontend → S3 + CloudFront
  # ────────────────────────────────────────────────
  deploy-frontend:
    name: 🌐 Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
      EC2_HOST: ${{ secrets.EC2_PUBLIC_IP }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Inject production API URL (HTTPS)
        working-directory: frontend
        run: |
          echo "VITE_API_BASE_URL=https://${{ env.EC2_HOST }}:8000" > .env.production

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync build to S3
        run: |
          aws s3 sync frontend/dist s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: ✅ Frontend deployed
        run: echo "Frontend deployed to S3 and CloudFront invalidated."

  # ────────────────────────────────────────────────
  # JOB 2: Build Backend Image in CI & Push to Registry
  # ────────────────────────────────────────────────
  build-and-push-backend:
    name: 🐳 Build & Push Backend Image (GHCR)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for Docker tag
        id: repo_name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/backend" >> $GITHUB_ENV

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Backend image pushed
        run: echo "Backend Docker image successfully built and pushed to GHCR."

  # ────────────────────────────────────────────────
  # JOB 3: Deploy Backend → EC2 (Pull Pre-built Image & Restart)
  # ────────────────────────────────────────────────
  deploy-backend:
    name: 🐍 Deploy Backend (EC2 t2.micro)
    runs-on: ubuntu-latest
    needs: [build-and-push-backend]
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_PUBLIC_IP }}
      EC2_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      GH_USER: ${{ github.actor }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lowercase repository name for Docker tag
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/backend:latest" >> $GITHUB_ENV

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.EC2_KEY }}" > ~/.ssh/lung_cancer_ec2.pem
          chmod 600 ~/.ssh/lung_cancer_ec2.pem
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2 via SSH (Pull & Restart)
        run: |
          ssh -i ~/.ssh/lung_cancer_ec2.pem ec2-user@${{ env.EC2_HOST }} bash -c "'
            set -e
            echo "=== Pulling latest git repository ==="
            cd /app
            git pull origin main

            echo "=== Authenticating with GHCR on EC2 ==="
            echo "${{ env.GH_TOKEN }}" | docker login ghcr.io -u "${{ env.GH_USER }}" --password-stdin

            echo "=== Pulling pre-built backend image from registry ==="
            docker pull ${{ env.IMAGE_NAME }}

            echo "=== Restarting backend container using pulled image (no on-instance build) ==="
            BACKEND_IMAGE=${{ env.IMAGE_NAME }} docker compose up -d --no-build --no-deps backend

            echo "=== Waiting for health check with retry loop ==="
            SUCCESS=0
            for i in \$(seq 1 12); do
              if curl -f -s http://localhost:8000/api/v2/health; then
                echo "✅ Backend healthy!"
                SUCCESS=1
                break
              fi
              echo "Health check attempt \$i failed, retrying in 5s..."
              sleep 5
            done
            if [ "\$SUCCESS" -ne 1 ]; then
              echo "❌ Health check failed after 60s"
              exit 1
            fi
          '"

      - name: ✅ Backend deployed
        run: echo "Backend pre-built image pulled and successfully redeployed on EC2."
